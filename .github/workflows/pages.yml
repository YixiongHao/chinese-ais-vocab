# Publishes site/ to GitHub Pages on every push to main.
#
# Branch-based Pages can only serve a repo root or /docs, and the site lives in site/,
# so this uploads that folder as the Pages artifact instead. It also means the published
# site is always whatever is in main — there is no second copy of the data to go stale.
#
# The site is static and has no build step: site/terms-data.js is generated by
# scripts/build.mjs and committed, so there is nothing to install and nothing to compile.
# The verify job below re-runs the build to prove the committed file matches the raw data,
# and fails the deploy if someone edited data/raw/ without rebuilding.

name: Deploy site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. In-progress runs finish rather than being cancelled, so a
# deploy is not left half-applied.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Rebuild and check the committed data is current
        # site/terms-data.js is deliberately excluded: it stamps the build date, so it
        # differs every day for reasons that have nothing to do with the data. smoke.mjs
        # below catches the case that actually matters — terms-data.js out of step with
        # terms.json — by loading it and comparing term counts.
        run: |
          node scripts/build.mjs
          git diff --exit-code -- data/terms.json exports/terms.csv \
            || { echo "::error::data/raw was edited without re-running scripts/build.mjs"; exit 1; }
      - name: Site invariants
        run: node scripts/smoke.mjs
      - name: Render every term
        run: node scripts/render-test.mjs

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
