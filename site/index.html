<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Safety Terminology · English ⇄ 中文</title>
<meta name="description" content="A bilingual English–Chinese terminology database for AI safety: recommended renderings, who uses them, and what each one gets wrong.">
<style>
  /* Light only, on purpose. There is no theme toggle and no colour-scheme detection —
     one set of colours, always the same, so a screenshot or a printout matches the screen. */
  :root {
    --bg: #ffffff;
    --bg-2: #fafaf8;
    --ink: #16181d;
    --ink-2: #474c58;
    --ink-3: #6a7080;
    --line: #e3e2de;
    --line-2: #efeeea;
    --accent: #9c3b2c;
    --accent-soft: #fbf0ed;
    --hi: #fff2b8;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --cjk: "Source Han Sans SC", "Noto Sans SC", "PingFang SC", "Microsoft YaHei",
           "Hiragino Sans GB", sans-serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: var(--sans); font-size: 15px; line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    /* App shell: the header is fixed height and the two columns scroll independently.
       Done in CSS alone — no measuring the header in JS, so nothing to get out of sync. */
    display: flex; flex-direction: column; overflow: hidden;
  }
  .zh { font-family: var(--cjk); }
  a { color: var(--accent); }

  /* ---------- header ---------- */
  header { flex: none; border-bottom: 1px solid var(--line); background: var(--bg-2); }
  .head-inner { max-width: 1500px; margin: 0 auto; padding: 12px 22px 0; }

  .brand { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .brand h1 { font-family: var(--serif); font-size: 19px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
  .brand .sub { color: var(--ink-3); font-size: 12.5px; }
  .brand .spacer { flex: 1; }
  .brand a.repo { color: var(--ink-3); font-size: 12.5px; text-decoration: none; }
  .brand a.repo:hover { color: var(--accent); text-decoration: underline; }

  .searchrow { display: flex; gap: 10px; align-items: center; margin-top: 10px; }
  #q {
    flex: 1; font: inherit; font-size: 16px; padding: 9px 12px;
    border: 1px solid var(--line); border-radius: 8px;
    background: var(--bg); color: var(--ink); font-family: var(--sans); min-width: 0;
  }
  #q:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
  #q::placeholder { color: var(--ink-3); }
  .count { color: var(--ink-3); font-size: 12.5px; white-space: nowrap; font-variant-numeric: tabular-nums; }

  .filters { display: flex; gap: 6px; flex-wrap: wrap; padding: 10px 0 0; }
  .chip {
    font-size: 12px; padding: 3px 10px; border-radius: 999px; cursor: pointer;
    border: 1px solid var(--line); background: var(--bg); color: var(--ink-2);
    font-family: inherit; white-space: nowrap;
  }
  .chip:hover { border-color: var(--ink-3); color: var(--ink); }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .chip.sep { border: none; background: none; pointer-events: none; color: var(--ink-3); padding-left: 6px; }
  .chip.clear { border-color: var(--accent); color: var(--accent); display: none; }
  .chip.clear.on { display: inline-block; }

  .legend {
    display: flex; gap: 14px; flex-wrap: wrap; align-items: center;
    font-size: 11.5px; color: var(--ink-3); padding: 9px 0 11px;
  }
  .legend span { display: inline-flex; gap: 5px; align-items: center; }
  .legend .lbl { font-weight: 650; letter-spacing: 0.04em; text-transform: uppercase; }

  /* ---------- shell ---------- */
  main {
    flex: 1; min-height: 0;
    max-width: 1500px; width: 100%; margin: 0 auto;
    display: grid; grid-template-columns: minmax(320px, 420px) 1fr;
  }
  #results { overflow-y: auto; padding: 12px 18px 48px 22px; border-right: 1px solid var(--line); }
  #detail  { overflow-y: auto; padding: 22px 26px 72px; }
  #results::-webkit-scrollbar, #detail::-webkit-scrollbar { width: 9px; }
  #results::-webkit-scrollbar-thumb, #detail::-webkit-scrollbar-thumb { background: var(--line); border-radius: 5px; }

  /* ---------- results ---------- */
  .cat-head {
    font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--ink-3); margin: 16px 0 5px; font-weight: 650;
  }
  .cat-head:first-child { margin-top: 2px; }
  .row {
    display: block; width: 100%; text-align: left; cursor: pointer;
    border: none; border-bottom: 1px solid var(--line-2); background: none;
    padding: 8px 10px; border-radius: 6px; font: inherit; color: inherit;
  }
  .row:hover { background: var(--bg-2); }
  .row[aria-selected="true"] { background: var(--accent-soft); }
  .row:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .row .en { font-weight: 550; }
  .row .abbr { color: var(--ink-3); font-family: var(--mono); font-size: 12px; margin-left: 6px; }
  .row .zh { font-family: var(--cjk); color: var(--ink-2); font-size: 14px; }
  .row .zh.none { color: var(--ink-3); font-style: italic; font-family: var(--sans); }
  .row .line2 { display: flex; gap: 8px; align-items: baseline; margin-top: 1px; }
  mark { background: var(--hi); color: inherit; border-radius: 2px; padding: 0 1px; }

  /* Difficulty dot. Deliberately a different hue family from the status tags below, so
     "this term is hard" never reads as "this rendering is contested". */
  .dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; flex: none; }
  .d-high { background: #b8402f; }
  .d-medium { background: #c98a24; }
  .d-low { background: transparent; border: 1px solid #c9c8c3; }

  .empty { color: var(--ink-3); padding: 40px 10px; text-align: center; font-size: 14px; }

  /* ---------- detail ---------- */
  .back { display: none; }

  .placeholder { color: var(--ink-2); font-size: 14px; max-width: 56ch; }
  .placeholder kbd {
    font-family: var(--mono); font-size: 11px; border: 1px solid var(--line);
    border-bottom-width: 2px; border-radius: 4px; padding: 1px 5px; color: var(--ink-2);
  }
  .placeholder ul { padding-left: 18px; margin: 10px 0; }
  .placeholder li { margin: 5px 0; }

  .term-head { border-bottom: 1px solid var(--line); padding-bottom: 14px; margin-bottom: 18px; }
  .term-head h2 {
    font-family: var(--serif); font-size: 27px; margin: 0 0 2px;
    font-weight: 600; letter-spacing: -0.015em;
  }
  .term-head .meta { color: var(--ink-3); font-size: 12.5px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .term-head .aliases { color: var(--ink-3); font-size: 13px; font-style: italic; margin-top: 3px; }

  .headline-zh {
    font-family: var(--cjk); font-size: 30px; font-weight: 600;
    margin: 14px 0 2px; cursor: copy; display: inline-block; line-height: 1.3;
  }
  .headline-zh:hover { color: var(--accent); }
  /* An English rendering is English — it should not be set in a CJK face. */
  .headline-zh.headline-en { font-family: var(--serif); font-size: 24px; font-weight: 600; }
  .tr-zh.tr-en { font-family: var(--serif); font-size: 17px; }
  .term-head h2.zh { font-family: var(--cjk); font-size: 30px; }
  .headline-zh.none { font-family: var(--serif); font-size: 20px; color: var(--ink-3); font-style: italic; cursor: default; }
  .headline-zh.none:hover { color: var(--ink-3); }
  .pinyin { color: var(--ink-3); font-size: 13.5px; font-style: italic; }

  section.blk { margin: 22px 0; }
  section.blk > h3 {
    font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--ink-3); margin: 0 0 8px; font-weight: 650;
  }
  section.blk > h3.cmt-lbl { color: var(--accent); }
  .def { max-width: 68ch; }
  .def.zh { font-family: var(--cjk); color: var(--ink-2); margin-top: 8px; }

  .callout {
    background: var(--accent-soft); border-left: 3px solid var(--accent);
    padding: 11px 14px; border-radius: 0 6px 6px 0; max-width: 68ch; font-size: 14.5px;
  }

  .tr {
    border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px;
    margin-bottom: 10px; background: var(--bg);
  }
  .tr.pref { border-color: #cfcdc6; background: var(--bg-2); }
  .tr-head { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .tr-zh { font-family: var(--cjk); font-size: 19px; font-weight: 600; cursor: copy; }
  .tr-zh:hover { color: var(--accent); }
  .tr-notes { color: var(--ink-2); font-size: 13.5px; margin-top: 6px; max-width: 66ch; }
  .lit { color: var(--ink-3); font-size: 13px; font-style: italic; }

  .tag {
    font-size: 10.5px; letter-spacing: 0.05em; text-transform: uppercase; font-weight: 650;
    padding: 2px 7px; border-radius: 4px; border: 1px solid var(--line); color: var(--ink-2);
    white-space: nowrap;
  }
  .tag.established { border-color: #2f7a41; color: #2f7a41; }
  .tag.common      { border-color: #2f6296; color: #2f6296; }
  .tag.contested   { border-color: #b45f14; color: #b45f14; }
  .tag.proposed    { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
  .tag.loanword    { border-color: #6a4fa3; color: #6a4fa3; }
  .tag.deprecated  { border-color: var(--ink-3); color: var(--ink-3); text-decoration: line-through; }
  .tag.descriptive, .tag.transliteration { border-color: var(--ink-3); color: var(--ink-3); }

  details.att { margin-top: 9px; }
  details.att > summary {
    cursor: pointer; font-size: 12px; color: var(--ink-3); list-style: none;
    user-select: none; padding: 2px 0;
  }
  details.att > summary::-webkit-details-marker { display: none; }
  details.att > summary::before { content: "▸ "; }
  details.att[open] > summary::before { content: "▾ "; }
  details.att > summary:hover { color: var(--accent); }
  blockquote.q {
    margin: 8px 0 0; padding: 8px 0 8px 12px; border-left: 2px solid var(--line);
    font-size: 13.5px;
  }
  blockquote.q .qzh { font-family: var(--cjk); }
  blockquote.q .qen { color: var(--ink-3); font-size: 12.5px; margin-top: 3px; }
  blockquote.q cite { display: block; font-style: normal; font-size: 12px; color: var(--ink-3); margin-top: 5px; }
  blockquote.q cite a { color: var(--accent); text-decoration: none; }
  blockquote.q cite a:hover { text-decoration: underline; }

  .ex { border-left: 2px solid var(--line); padding-left: 12px; margin-bottom: 12px; }
  .ex .exzh { font-family: var(--cjk); }
  .ex .exen { color: var(--ink-3); font-size: 13.5px; margin-top: 2px; }

  .pills { display: flex; gap: 6px; flex-wrap: wrap; }
  .pill {
    font-size: 12.5px; padding: 3px 10px; border-radius: 999px; cursor: pointer;
    border: 1px solid var(--line); background: var(--bg); color: var(--ink-2); font-family: inherit;
  }
  .pill:hover { border-color: var(--accent); color: var(--accent); }
  .usedby { font-size: 13.5px; color: var(--ink-2); margin: 0; padding-left: 18px; }
  .usedby li { margin-bottom: 3px; }
  .usedby .zh { font-family: var(--cjk); color: var(--ink); }

  .srclist { font-size: 12.5px; padding-left: 18px; color: var(--ink-3); }
  .srclist a { color: var(--ink-2); }
  .srclist li { margin-bottom: 2px; word-break: break-all; }

  #toast {
    position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--ink); color: #fff; padding: 7px 16px; border-radius: 999px;
    font-size: 13px; opacity: 0; pointer-events: none; transition: all .18s ease; z-index: 50;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ---------- narrow screens ----------
     One column, and the two panes take turns. The previous layout hid the detail pane
     outright below 900px, which meant every term on a phone was a dead end. */
  @media (max-width: 880px) {
    body { height: auto; overflow: visible; }
    main { grid-template-columns: 1fr; }
    #results { border-right: none; padding: 12px 16px 48px; }
    #detail { padding: 16px 16px 64px; }
    #results, #detail { overflow-y: visible; }
    html[data-view="detail"] #results { display: none; }
    html:not([data-view="detail"]) #detail { display: none; }
    .back {
      display: inline-block; font: inherit; font-size: 13px; cursor: pointer;
      background: none; border: 1px solid var(--line); border-radius: 6px;
      padding: 4px 10px; color: var(--ink-2); margin-bottom: 14px;
    }
    .legend { display: none; }
    .head-inner { padding: 10px 16px 0; }
  }
</style>
</head>
<body>

<header>
  <div class="head-inner">
    <div class="brand">
      <h1>AI Safety Terminology</h1>
      <span class="sub">English ⇄ 中文</span>
      <span class="spacer"></span>
      <a class="repo" href="https://github.com/YixiongHao/ais-vocab-cn" target="_blank" rel="noopener">source &amp; data on GitHub ↗</a>
    </div>
    <div class="searchrow">
      <label for="q" class="sr-only" hidden>Search terms</label>
      <input id="q" type="search" autocomplete="off" spellcheck="false"
             placeholder="Search — English, 中文, or pinyin (tones optional)…">
      <span class="count" id="count" aria-live="polite"></span>
    </div>
    <div class="filters" id="filters"></div>
    <div class="legend">
      <span class="lbl">Translation difficulty</span>
      <span><i class="dot d-high"></i> high — no settled rendering, or the usual one distorts it</span>
      <span><i class="dot d-medium"></i> medium — competing renderings</span>
      <span><i class="dot d-low"></i> low — settled</span>
      <span class="spacer"></span>
      <span id="stat"></span>
    </div>
  </div>
</header>

<main>
  <div id="results"></div>
  <div id="detail"></div>
</main>

<div id="toast"></div>

<script src="terms-data.js"></script>
<script>
(function () {
  'use strict'
  const DATA = window.VOCAB || { terms: [], categories: [], generated: '' }
  const TERMS = DATA.terms
  const CATS = DATA.categories
  const catById = Object.fromEntries(CATS.map(c => [c.id, c]))
  const byId = Object.fromEntries(TERMS.map(t => [t.id, t]))

  const $ = s => document.querySelector(s)
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))

  // Pinyin is stored with tone marks (gōngjùxìng). Nobody types those. Decompose to
  // base letter + combining mark and drop the marks, so "gongjuxing" finds it — and
  // keep a space-free copy too, since it is a coin flip whether a reader writes
  // "gongju xing" or "gongjuxing".
  const detone = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '')

  // ---------- searchable haystack, built once ----------
  // Chinese-origin entries invert: the headword is Chinese, the renderings are English.
  // Everything downstream reads `_rend` / `_headZh` / `_headEn` so it need not care which.
  for (const t of TERMS) {
    t._zhOrigin = t.direction === 'zh-to-en'
    t._rend = (t._zhOrigin ? t.en_renderings : t.translations) || []
    t._key = t._zhOrigin ? 'en' : 'zh'
    t._headZh = t._zhOrigin ? t.zh_headword : t.preferred_zh
    t._headEn = t._zhOrigin ? (t.preferred_en || t.en) : t.en
    const zh = [t.zh_headword || '', ...(t.translations || []).map(x => x.zh)].join(' ')
    const en = [(t.en_renderings || []).map(x => x.en).join(' '), (t.en_aliases || []).join(' ')].join(' ')
    const py = [t.pinyin || '', ...(t.translations || []).map(x => x.pinyin || '')].join(' ')
    const pyPlain = detone(py)
    t._hay = [t.en, t.abbr || '', en, zh, py, pyPlain, pyPlain.replace(/\s+/g, ''),
              t.definition_en || '', t.definition_zh || '', (t.tags || []).join(' ')]
             .join(' ').toLowerCase()
    t._en = t.en.toLowerCase()
  }

  // ---------- state ----------
  const state = { q: '', cat: null, flag: null, sel: null }

  // ---------- filters ----------
  const FLAGS = [
    ['zhorigin',  'Chinese-origin terms', t => t._zhOrigin],
    ['hard',      'Hard to translate', t => t.translation_difficulty === 'high'],
    ['noterm',    'No settled term',
                  t => !t._rend.length || t._rend.every(x => ['proposed','descriptive'].includes(x.status))],
    ['contested', 'Contested', t => t._rend.some(x => x.status === 'contested') || t._rend.length > 2],
    ['pitfall',   'Has a pitfall', t => !!(t.pitfalls || t.why_no_english)],
    ['unattested','Needs evidence', t => !t.attestation_count],
  ]
  const flagById = Object.fromEntries(FLAGS.map(f => [f[0], f[2]]))

  function renderFilters() {
    const f = $('#filters')
    // Categories are listed English-origin first, then a rule, then the Chinese-origin ones.
    let prevDir = null
    const catChips = CATS.map(c => {
      const rule = prevDir && c.direction !== prevDir ? '<span class="chip sep">中文 →</span>' : ''
      prevDir = c.direction
      return rule + `<button class="chip" data-cat="${c.id}" aria-pressed="false" title="${esc(c.blurb)}">${esc(c.en)}</button>`
    }).join('')
    const flagChips = FLAGS.map(([id, label]) =>
      `<button class="chip" data-flag="${id}" aria-pressed="false">${esc(label)}</button>`
    ).join('')
    f.innerHTML = catChips + '<span class="chip sep">·</span>' + flagChips +
      '<button class="chip clear" id="clearBtn" data-clear="1">Clear filters ✕</button>'
    f.addEventListener('click', e => {
      const b = e.target.closest('.chip'); if (!b) return
      if (b.dataset.clear) { state.cat = null; state.flag = null }
      if (b.dataset.cat) state.cat = state.cat === b.dataset.cat ? null : b.dataset.cat
      if (b.dataset.flag) state.flag = state.flag === b.dataset.flag ? null : b.dataset.flag
      syncChips(); render()
    })
  }
  function syncChips() {
    for (const b of document.querySelectorAll('.chip[data-cat]'))
      b.setAttribute('aria-pressed', String(b.dataset.cat === state.cat))
    for (const b of document.querySelectorAll('.chip[data-flag]'))
      b.setAttribute('aria-pressed', String(b.dataset.flag === state.flag))
    const clear = $('#clearBtn')
    if (clear && clear.classList) {
      if (state.cat || state.flag) clear.classList.add('on'); else clear.classList.remove('on')
    }
  }

  // ---------- search ----------
  function score(t, q) {
    if (!q) return 1
    if (t._en === q) return 1000
    if (t.zh_headword === q) return 990
    if ((t.abbr || '').toLowerCase() === q) return 900
    if (t.translations.some(x => x.zh === q)) return 880
    if (t._en.startsWith(q)) return 700
    if ((t.en_aliases || []).some(a => a.toLowerCase().startsWith(q))) return 600
    if ((t.zh_headword || '').includes(q)) return 570
    if (t.translations.some(x => x.zh.includes(q))) return 550
    if (new RegExp('\\b' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).test(t._en)) return 500
    if (t._en.includes(q)) return 400
    if (t._hay.includes(q)) return 200
    return 0
  }

  function filtered() {
    const q = state.q.trim().toLowerCase()
    let out = TERMS
    if (state.cat) out = out.filter(t => t.category === state.cat)
    if (state.flag) out = out.filter(flagById[state.flag])
    if (q) {
      out = out.map(t => [score(t, q), t]).filter(x => x[0] > 0)
             .sort((a, b) => b[0] - a[0] || a[1]._en.localeCompare(b[1]._en)).map(x => x[1])
    }
    return out
  }

  function hl(text, q) {
    if (!q) return esc(text)
    const i = String(text).toLowerCase().indexOf(q)
    if (i < 0) return esc(text)
    return esc(text.slice(0, i)) + '<mark>' + esc(text.slice(i, i + q.length)) + '</mark>' + esc(text.slice(i + q.length))
  }

  // ---------- results list ----------
  function render() {
    const list = filtered()
    const q = state.q.trim().toLowerCase()
    $('#count').textContent = list.length === TERMS.length
      ? `${TERMS.length} terms` : `${list.length} of ${TERMS.length}`

    if (!list.length) {
      $('#results').innerHTML = `<div class="empty">Nothing matches. Try a shorter query, or clear the filters.</div>`
      return
    }

    // Grouped by category when browsing; flat, relevance-ordered when searching.
    let html = ''
    const rowFor = t => {
      // Uniform shape in both directions: English headword on top so the list stays
      // scannable for an English reader, Chinese below, with a marker on the entries
      // where Chinese is the source language rather than the target.
      const zhCell = t._headZh
        ? `<span class="zh">${hl(t._headZh, q)}</span>`
        : `<span class="zh none">no settled term</span>`
      const n = t._rend.length
      return `<button class="row" data-id="${t.id}" aria-selected="${t.id === state.sel}">
        <div><span class="en">${hl(t._headEn, q)}</span>${t.abbr ? `<span class="abbr">${esc(t.abbr)}</span>` : ''}${
          t._zhOrigin ? '<span class="abbr" title="Chinese-origin term">中→en</span>' : ''}</div>
        <div class="line2">
          <span class="dot d-${t.translation_difficulty}" title="translation difficulty: ${t.translation_difficulty}"></span>
          ${zhCell}${n > 1 ? `<span class="abbr">+${n - 1}</span>` : ''}
        </div>
      </button>`
    }

    if (q) {
      html = list.map(rowFor).join('')
    } else {
      for (const c of CATS) {
        const inCat = list.filter(t => t.category === c.id)
        if (!inCat.length) continue
        html += `<div class="cat-head">${esc(c.en)} <span class="zh">${esc(c.zh)}</span></div>`
        html += inCat.map(rowFor).join('')
      }
    }
    $('#results').innerHTML = html
  }

  // ---------- detail ----------
  function attHtml(a) {
    const cite = [a.publisher, a.source_title, a.date].filter(Boolean).map(esc).join(' · ')
    // An English rendering may be evidenced by an official English translation, in which
    // case there is no Chinese sentence — show whichever side exists.
    return `<blockquote class="q">
      ${a.quote_zh ? `<div class="qzh">${esc(a.quote_zh)}</div>` : ''}
      ${a.quote_en ? `<div class="${a.quote_zh ? 'qen' : 'qzh'}">${esc(a.quote_en)}</div>` : ''}
      <cite>${cite}${a.url ? ` — <a href="${esc(a.url)}" target="_blank" rel="noopener">source ↗</a>` : ''}${
        a.unverified ? ' <span class="tag contested" title="Source could not be re-fetched during verification — not disproved, just unchecked">unverified</span>' : ''}</cite>
    </blockquote>`
  }

  // What each status badge claims, spelled out on hover — the words alone are ambiguous
  // ("common" vs "established" reads as a judgement rather than an evidence claim).
  const STATUS_HELP = {
    established: 'Widely used in Chinese sources; someone in the field will recognise it.',
    common: 'Appears repeatedly, but competes with other renderings.',
    contested: 'Several renderings in active use with no winner — and the choice carries meaning.',
    descriptive: 'Chinese sources explain the concept in a phrase rather than with a fixed term.',
    proposed: 'Not attested anywhere. This is our coinage, and the notes say why.',
    loanword: 'The English is kept as-is inside Chinese text. Often the honest answer.',
    transliteration: 'Phonetic rendering of the English.',
    deprecated: 'Attested, but we recommend against it — the notes say why.',
  }

  // One renderer for both directions; `key` selects which side holds the rendering.
  function trHtml(tr, isPref, key) {
    const val = tr[key] ?? ''
    const nAtt = (tr.attestations || []).length
    const nUnver = (tr.attestations || []).filter(a => a.unverified).length
    return `<div class="tr${isPref ? ' pref' : ''}">
      <div class="tr-head">
        <span class="tr-zh${key === 'en' ? ' tr-en' : ''}" data-copy="${esc(val)}">${esc(val)}</span>
        ${tr.pinyin ? `<span class="pinyin">${esc(tr.pinyin)}</span>` : ''}
        <span class="tag ${esc(tr.status)}" title="${esc(STATUS_HELP[tr.status] || '')}">${esc(tr.status)}</span>
        ${isPref ? '<span class="tag" title="The rendering this database recommends using.">recommended</span>' : ''}
      </div>
      ${tr.literal_back ? `<div class="lit">lit. “${esc(tr.literal_back)}”</div>` : ''}
      ${tr.notes ? `<div class="tr-notes">${esc(tr.notes)}</div>` : ''}
      ${nAtt
        ? `<details class="att"><summary>${nAtt} attestation${nAtt > 1 ? 's' : ''}${
            nUnver ? ` · ${nUnver} unverified` : ''}</summary>${tr.attestations.map(attHtml).join('')}</details>`
        : (tr.status === 'proposed' ? '' : `<div class="lit" style="margin-top:6px">no attestation on file</div>`)}
    </div>`
  }

  function showTerm(id) {
    const t = byId[id]
    if (!t) return
    state.sel = id
    history.replaceState(null, '', '#' + id)
    for (const r of document.querySelectorAll('.row'))
      r.setAttribute('aria-selected', String(r.dataset.id === id))

    const cat = catById[t.category] || { en: t.category, zh: '' }
    const zhOrigin = t._zhOrigin
    const key = t._key
    const preferred = zhOrigin ? t.preferred_en : t.preferred_zh
    const prefTr = t._rend.find(x => x[key] === preferred)
    const others = t._rend.filter(x => x[key] !== preferred)

    // Chinese-origin entries lead with the Chinese headword — it is the source term, and
    // the English below it is the approximation. The English-origin entries do the reverse.
    let h = `<button class="back" data-back="1">← All terms</button>
    <div class="term-head">
      <h2${zhOrigin ? ' class="zh"' : ''}>${esc(zhOrigin ? t.zh_headword : t.en)}</h2>
      ${zhOrigin && t.pinyin ? `<div class="pinyin">${esc(t.pinyin)}</div>` : ''}
      ${(t.en_aliases || []).length ? `<div class="aliases">also: ${t.en_aliases.map(esc).join(' · ')}</div>` : ''}
      <div class="meta">
        <span>${esc(cat.en)}</span>
        ${zhOrigin ? '<span title="Chinese is the source language here">中文 → English</span>' : ''}
        ${t.abbr ? `<span style="font-family:var(--mono)">${esc(t.abbr)}</span>` : ''}
        <span>difficulty: ${esc(t.translation_difficulty)}</span>
        <span>confidence: ${esc(t.confidence)}</span>
        <span>${t.attestation_count} citation${t.attestation_count === 1 ? '' : 's'}</span>
      </div>
      ${preferred
        ? `<div class="headline-zh${zhOrigin ? ' headline-en' : ' zh'}" data-copy="${esc(preferred)}" title="click to copy">${esc(preferred)}</div>
           ${!zhOrigin && prefTr && prefTr.pinyin ? `<div class="pinyin">${esc(prefTr.pinyin)}</div>` : ''}`
        : `<div class="headline-zh none">no settled ${zhOrigin ? 'English' : 'Chinese'} rendering</div>`}
    </div>`

    if (t.why_no_english) {
      h += `<section class="blk"><h3>Why English has no word for this</h3>
        <div class="callout">${esc(t.why_no_english)}</div></section>`
    }

    if (t.definition_en || t.definition_zh) {
      h += `<section class="blk"><h3>Definition</h3>
        ${t.definition_en ? `<div class="def">${esc(t.definition_en)}</div>` : ''}
        ${t.definition_zh ? `<div class="def zh">${esc(t.definition_zh)}</div>` : ''}
      </section>`
    }

    // Rendered last, after everything sourced. This is our own analysis rather than a
    // citation, and it is labelled so the line between evidence and opinion stays visible.
    const commentary = t.pitfalls
      ? `<section class="blk"><h3 class="cmt-lbl">Claude's commentary · not from a source</h3>
           <div class="callout">${esc(t.pitfalls)}</div></section>`
      : ''

    if (t._rend.length) {
      h += `<section class="blk"><h3>${zhOrigin ? 'English renderings' : 'Renderings'}</h3>
        ${prefTr ? trHtml(prefTr, true, key) : ''}
        ${others.map(x => trHtml(x, false, key)).join('')}
      </section>`
    }

    if ((t.usage_examples || []).length) {
      h += `<section class="blk"><h3>In use</h3>` + t.usage_examples.map(e => `<div class="ex">
        <div class="exzh">${esc(e.zh)}</div>
        ${e.en ? `<div class="exen">${esc(e.en)}</div>` : ''}
      </div>`).join('') + `</section>`
    }

    if ((t.used_by || []).length) {
      h += `<section class="blk"><h3>Used by</h3><ul class="usedby">` + t.used_by.map(u =>
        `<li><strong>${esc(u.org)}</strong>${u.zh_used ? ` — <span class="zh">${esc(u.zh_used)}</span>` : ''}${u.note ? ` <span style="color:var(--ink-3)">(${esc(u.note)})</span>` : ''}</li>`
      ).join('') + `</ul></section>`
    }

    if ((t.related || []).length) {
      h += `<section class="blk"><h3>Related</h3><div class="pills">` + t.related
        .filter(r => byId[r])
        .map(r => `<button class="pill" data-goto="${r}">${esc(byId[r].en)}</button>`).join('') + `</div></section>`
    }

    if ((t.sources || []).length) {
      h += `<section class="blk"><h3>Sources consulted</h3><ul class="srclist">` + t.sources.map(s =>
        `<li>${/^https?:/.test(s) ? `<a href="${esc(s)}" target="_blank" rel="noopener">${esc(s)}</a>` : esc(s)}</li>`
      ).join('') + `</ul></section>`
    }

    h += commentary

    h += `<div class="lit" style="margin-top:26px">last researched ${esc(t.last_researched || '—')}</div>`

    $('#detail').innerHTML = h
    $('#detail').scrollTop = 0
  }

  function placeholder() {
    $('#detail').innerHTML = `<div class="placeholder">
      <p>Pick a term, or start typing. Search accepts English, Chinese, or pinyin —
      typing <span class="zh">对齐</span> finds <em>alignment</em>, and
      <em>duiqi</em> finds it too.</p>
      <p>The filters above are the interesting part:</p>
      <ul>
        <li><strong>Chinese-origin terms</strong> — concepts PRC discourse has that English
            has no clean word for. These run the other way: Chinese is the source, and the
            English is the approximation.</li>
        <li><strong>No settled term</strong> — concepts neither field has named yet.
            These are where a translation choice is still up for grabs.</li>
        <li><strong>Has a pitfall</strong> — where the obvious rendering quietly changes the meaning.</li>
        <li><strong>Needs evidence</strong> — entries with no citation behind them yet.</li>
      </ul>
      <p style="color:var(--ink-3);font-size:13px">
        <kbd>/</kbd> search · <kbd>↑</kbd><kbd>↓</kbd> move · <kbd>↵</kbd> open · <kbd>esc</kbd> clear
      </p>
    </div>`
  }

  // ---------- interactions ----------
  let toastTimer
  function toast(msg) {
    const el = $('#toast'); el.textContent = msg; el.classList.add('show')
    clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 1300)
  }

  // On a narrow screen the two panes take turns; on a wide one both are always visible and
  // this attribute does nothing. Set on documentElement rather than body so it is one
  // attribute on the element the CSS already keys off.
  const view = v => { document.documentElement.dataset.view = v }

  document.addEventListener('click', e => {
    const copy = e.target.closest('[data-copy]')
    if (copy) {
      navigator.clipboard?.writeText(copy.dataset.copy)
        .then(() => toast('Copied ' + copy.dataset.copy))
        .catch(() => {})
      return
    }
    if (e.target.closest('[data-back]')) { view(''); return }
    const goto = e.target.closest('[data-goto]')
    if (goto) { showTerm(goto.dataset.goto); view('detail'); return }
    const row = e.target.closest('.row')
    if (row) { showTerm(row.dataset.id); view('detail') }
  })

  $('#q').addEventListener('input', e => { state.q = e.target.value; render() })

  document.addEventListener('keydown', e => {
    if (e.key === '/' && document.activeElement !== $('#q')) { e.preventDefault(); $('#q').focus(); return }
    if (e.key === 'Escape') { state.q = ''; $('#q').value = ''; render(); $('#q').blur(); return }
    if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp' && e.key !== 'Enter') return
    const rows = [...document.querySelectorAll('.row')]
    if (!rows.length) return
    const i = rows.findIndex(r => r.dataset.id === state.sel)
    // Enter commits: on a narrow screen that is what swaps to the detail pane. Arrow keys
    // only move the selection, so holding one down does not bounce the view back and forth.
    if (e.key === 'Enter') { if (i >= 0) { e.preventDefault(); showTerm(rows[i].dataset.id); view('detail') } return }
    e.preventDefault()
    const next = e.key === 'ArrowDown'
      ? rows[Math.min(i + 1, rows.length - 1)] ?? rows[0]
      : rows[Math.max(i - 1, 0)] ?? rows[0]
    showTerm(next.dataset.id)
    next.scrollIntoView({ block: 'nearest' })
  })

  // ---------- boot ----------
  const nGap = TERMS.filter(flagById.noterm).length
  const nZh = TERMS.filter(t => t._zhOrigin).length
  $('#stat').textContent = `${TERMS.length} terms · ${nZh} Chinese-origin · ${nGap} with no settled rendering · built ${DATA.generated}`
  renderFilters()
  render()
  // A merged-away term keeps its id resolvable: links shared before the merge should land
  // on the surviving entry rather than an empty pane.
  const retired = {}
  for (const t of TERMS) for (const r of t.retired_ids || []) retired[r] = t.id

  const hash = decodeURIComponent(location.hash.slice(1))
  const target = byId[hash] ? hash : retired[hash]
  // A shared link opens straight onto the term, including on a phone.
  if (target) { showTerm(target); view('detail') } else placeholder()
})()
</script>
</body>
</html>
